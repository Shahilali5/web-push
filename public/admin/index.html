<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔔 Push Dashboard — WebPush</title>
  <link rel="icon" href="/test/bell.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b2e;
      --line: #242c45;
      --tx: #e6e9f2;
      --mut: #8b93ad;
      --ac: #6366f1;
      --ac-hover: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    header {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    header b {
      font-size: 16px;
      margin-right: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    nav {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    nav button, .btn {
      background: var(--card);
      color: var(--tx);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    nav button:hover, .btn:hover { border-color: var(--ac); }
    nav button.on, .btn.p {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff;
    }
    main {
      padding: 20px;
      max-width: 1080px;
      margin: auto;
    }
    .tab { display: none; }
    .tab.on { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin: 12px 0 4px;
      color: var(--mut);
      font-size: 12px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--tx);
      font-size: 13px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--ac); }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media(max-width:720px) { .row { grid-template-columns: 1fr; } }
    .code-box {
      background: #060913;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      color: #a5b4fc;
      white-space: pre-wrap;
    }
    #login {
      max-width: 360px;
      margin: 20vh auto;
    }
  </style>
</head>
<body>

<div id="login" class="card">
  <div style="font-size:16px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px;">
    <i class="bi bi-shield-lock-fill" style="color:var(--ac);"></i> Admin Login
  </div>
  <label>Admin Key</label>
  <input id="key" type="password" value="change-me-admin">
  <div style="margin-top:16px;">
    <button class="btn p" style="width:100%; justify-content:center;" onclick="login()">Enter Dashboard</button>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <b><i class="bi bi-bell-fill" style="color:var(--ac);"></i> WebPush Dashboard <span style="font-size:12px;opacity:0.6;font-weight:normal;">(Port 3050)</span></b>
    <span id="online" style="font-size:12px;color:#10b981;font-weight:600;"><i class="bi bi-broadcast"></i> ● 0 online</span>
    <nav>
      <button data-t="send" class="on"><i class="bi bi-send-fill"></i> Send Notification</button>
      <button data-t="embed"><i class="bi bi-code-slash"></i> Embed Script</button>
      <a href="/test" class="btn" target="_blank"><i class="bi bi-phone"></i> Test Web Lab ↗</a>
    </nav>
  </header>

  <main>
    <!-- SEND TAB -->
    <section id="send" class="tab on">
      <div class="card">
        <div style="font-size:15px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px;">
          <i class="bi bi-broadcast-pin"></i> Broadcast WebSocket Notification
        </div>
        <div class="row">
          <div>
            <label>Target Site Key</label>
            <input id="siteKey" value="change-me-site">

            <label>Audience Target</label>
            <select id="targetSelect" onchange="syncTarget()">
              <option value="all">All Visitors on This Site</option>
              <option value="user">Specific User ID</option>
              <option value="tag">Specific Tag</option>
            </select>
            <input id="targetVal" placeholder="Target identifier (e.g. 1024 or vip)" style="display:none; margin-top:8px;">

            <label>Title</label>
            <input id="title" value="Welcome to our platform! 🎉">

            <label>Message Body</label>
            <textarea id="body" rows="3">Get 20% discount on your first subscription today.</textarea>
          </div>

          <div>
            <label>Click URL</label>
            <input id="url" value="/deals">

            <label>Icon URL</label>
            <input id="icon" value="/test/bell.svg">

            <label>Banner Image URL (Optional)</label>
            <input id="image" placeholder="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600">

            <div style="margin-top:20px; display:flex; gap:10px;">
              <button class="btn p" onclick="sendBroadcast()"><i class="bi bi-send-fill"></i> Send Broadcast Now</button>
            </div>
            <div id="sendResult" style="margin-top:12px; font-size:12px;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- EMBED TAB -->
    <section id="embed" class="tab">
      <div class="card">
        <div style="font-size:15px; font-weight:700; margin-bottom:12px;"><i class="bi bi-code-slash"></i> 1-Line Embed Code for Any Website</div>
        <p style="color:var(--mut); font-size:13px; margin-bottom:14px;">Add this single line before <code>&lt;/body&gt;</code> on any website. Visitors to that site will automatically connect and receive notifications sent with this site key:</p>
        <div class="code-box" id="embedSnippet"></div>
        <button class="btn" style="margin-top:12px;" onclick="copyEmbed()"><i class="bi bi-clipboard"></i> Copy Embed Code</button>
      </div>
    </section>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  let socket = null;
  let adminKey = 'change-me-admin';

  function login() {
    adminKey = document.getElementById('key').value.trim();
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    socket = io('/admin', { auth: { key: adminKey } });
    socket.on('online', n => {
      document.getElementById('online').innerHTML = `<i class="bi bi-broadcast"></i> ● ${n} online`;
    });

    updateEmbedSnippet();
  }

  document.querySelectorAll('nav button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('nav button, .tab').forEach(el => el.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById(btn.dataset.t).classList.add('on');
    };
  });

  function syncTarget() {
    const val = document.getElementById('targetSelect').value;
    document.getElementById('targetVal').style.display = val === 'all' ? 'none' : 'block';
  }

  async function sendBroadcast() {
    const siteKey = document.getElementById('siteKey').value.trim() || 'change-me-site';
    const targetType = document.getElementById('targetSelect').value;
    const targetVal = document.getElementById('targetVal').value.trim();
    let target = 'all';
    if (targetType === 'user') target = 'user:' + targetVal;
    if (targetType === 'tag') target = 'tag:' + targetVal;

    const payload = {
      site_key: siteKey,
      target: target,
      title: document.getElementById('title').value.trim(),
      body: document.getElementById('body').value.trim(),
      url: document.getElementById('url').value.trim(),
      icon: document.getElementById('icon').value.trim(),
      image: document.getElementById('image').value.trim() || null,
      buttons: [
        { action: 'close', title: 'Close' },
        { action: 'open', title: 'View ↗', url: document.getElementById('url').value.trim() }
      ]
    };

    const resEl = document.getElementById('sendResult');
    resEl.innerHTML = '<span style="color:#f59e0b;">Sending...</span>';

    try {
      const res = await fetch('/api/v1/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-site-key': siteKey },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      resEl.innerHTML = '<span style="color:#10b981;">✓ Notification broadcasted successfully via Socket.IO!</span>';
    } catch (err) {
      resEl.innerHTML = '<span style="color:#ef4444;">Failed to send: ' + err.message + '</span>';
    }
  }

  function updateEmbedSnippet() {
    const site = document.getElementById('siteKey') ? document.getElementById('siteKey').value : 'change-me-site';
    const origin = window.location.origin;
    document.getElementById('embedSnippet').textContent =
`<script src="${origin}/sdk.js" data-site-key="${site}" data-widget="true"><\/script>`;
  }

  function copyEmbed() {
    navigator.clipboard.writeText(document.getElementById('embedSnippet').textContent).then(() => {
      alert('Embed script copied to clipboard!');
    });
  }
</script>

</body>
</html>
